name: Claude Code Audit

on:
  workflow_dispatch: # Запуск только вручную из вкладки Actions

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Claude Audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx @anthropic-ai/claude-code --dangerously-skip-permissions -p "Проведи полный аудит проекта на соответствие требованиям из файла .github/TZ.md и выведи детальный отчет в формате Markdown." > audit-report.md

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-audit-report
          path: audit-report.md